<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Attendance Dashboard</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: 'Poppins', sans-serif;
        }
    </style>

</head>

<body class="bg-slate-100">

    <div class="max-w-7xl mx-auto p-6">

        <!-- Breadcrumb -->

        <div class="flex items-center space-x-2 text-sm mb-6">

            <span class="text-gray-500">Dashboard</span>

            <span class="text-gray-400">></span>

            <span class="text-blue-600 font-semibold">
                Church Attendance Overview
            </span>

        </div>


        <!-- Main Layout -->

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

            <!-- Left Card -->

            <div class="bg-white rounded-3xl shadow-sm p-8">

                <!-- Time -->

                <div class="flex items-center gap-4">

                    <div class="text-yellow-500 text-3xl">
                        ☀
                    </div>

                    <h1 class="text-5xl font-bold text-slate-800">
                        02:32:35 PM
                    </h1>

                </div>


                <h2 class="text-2xl mt-4 text-gray-600">
                    Live Service Time
                </h2>

                <p class="text-gray-400 mt-3 leading-7">
                    Real-time attendance monitoring for today's church service.
                </p>

                <p class="text-blue-600 font-semibold mt-3">
                    Sunday Worship Service
                </p>


                <div class="mt-28">

                    <h3 class="text-3xl font-bold text-slate-800">
                        Today:
                    </h3>

                    <p class="text-3xl font-bold text-slate-800 mt-2">
                        June 29, 2026
                    </p>

                </div>


                <button
                    class="mt-10 w-full bg-blue-600 hover:bg-blue-700 text-white py-5 rounded-2xl text-xl font-semibold">

                    ⚙ Manage Attendance

                </button>

            </div>


            <!-- Right Section -->

            <div class="lg:col-span-3">

                <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-6">

                    <!-- Card 1 -->

                    <div class="bg-white rounded-3xl shadow-sm p-8">

                        <div class="flex justify-between items-center">

                            <h1 class="text-6xl font-bold text-slate-800">
                                0
                            </h1>

                            <div class="w-14 h-14 rounded-2xl bg-indigo-100 flex items-center justify-center text-blue-600 text-2xl">

                                👥

                            </div>

                        </div>

                        <h2 class="text-3xl font-semibold mt-8 text-slate-700">
                            Registered Members
                        </h2>

                        <p class="text-gray-400 mt-4 leading-7">

                            🟢 Total members registered in the church database

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
